<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ec">
  <meta name="description" content="Steam 玩家好评率对决 / The Steam approval challenge">
  <title>Score Duel — Steam 好评率对决</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" id="brand" aria-label="Score Duel 首页"><span class="brand-icon" aria-hidden="true">✳</span> score<span class="brand-light">duel</span><span class="brand-dot">.</span></a>
    <span class="header-note" data-i18n="tagline">给游戏直觉的一场小测验</span>
    <div class="header-actions"><div class="language-switch" role="group" id="language-switch" aria-label="语言"><button type="button" id="language-zh" lang="zh-CN" aria-pressed="true">中文</button><button type="button" id="language-en" lang="en" aria-pressed="false">EN</button></div><button class="text-button" id="rules-button" type="button" data-i18n="rulesButton">怎么玩 ↗</button></div>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div class="eyebrow"><span class="live-dot"></span><span data-i18n="eyebrow">STEAM 好评率挑战</span></div>
      <h1 id="page-title"><span class="hero-first" data-i18n="heroA">好游戏，</span> <span data-i18n="heroB">你说了算？</span></h1>
      <p><span data-i18n="intro">两款游戏，谁的玩家好评率更高？</span> <strong data-i18n="introStrong">点击你看好的封面。</strong></p>
      <div class="data-status" id="data-status" role="status" aria-live="polite"></div>
    </section>
    <section class="play-area" aria-label="好评率对决" id="play-area" aria-busy="true">
      <div class="game-toolbar">
        <div class="round"><span class="tiny-label" data-i18n="round">回合</span><strong id="round">01</strong><span class="round-divider"></span><span id="round-instruction"></span></div>
        <div class="stats"><span class="correct-count"><span data-i18n="correctLabel">答对</span><strong id="correct">0</strong></span><span class="stat-divider"></span><span id="lives" class="lives"></span></div>
      </div>
      <div class="arena">
        <div class="game-column left-column">
          <div class="card-heading"><span><span class="small-dot"></span><span data-i18n="benchmark">已知好评率</span></span><span data-i18n="benchmarkEn">本轮基准</span></div>
          <button class="game-card" id="left-card" type="button" disabled>
            <img class="cover" id="left-cover" alt="" draggable="false"><div class="card-shade"></div>
            <span class="card-index">01 / PLAYER'S PICK</span><span class="pick-indicator" data-i18n="picked">你的选择 ↗</span>
            <span class="card-content"><span class="game-meta" id="left-meta">STEAM</span><span class="game-name" id="left-name">正在准备对决…</span><span class="score-row"><span class="score" id="left-score">—</span><span class="score-caption"><span data-i18n="scoreLabel">STEAM 好评率</span><span id="left-score-caption" data-i18n="positiveLabel">玩家好评占比</span><span class="review-count" id="left-reviews"></span></span></span></span>
            <span class="card-choice"><span data-i18n="choose">这款好评率更高</span><span aria-hidden="true">↗</span></span>
          </button>
          <div class="card-footnote"><span data-i18n="pickLeft">← 点击封面选择</span><a id="left-source" target="_blank" rel="noopener noreferrer" data-i18n="source" hidden>Steam 评价 ↗</a></div>
        </div>
        <div class="versus" aria-hidden="true"><span>VS</span></div>
        <div class="game-column right-column">
          <div class="card-heading"><span><span class="small-dot purple"></span><span data-i18n="challenger">等你揭晓</span></span><span data-i18n="challengerEn">本轮挑战者</span></div>
          <button class="game-card" id="right-card" type="button" disabled>
            <img class="cover" id="right-cover" alt="" draggable="false"><div class="card-shade"></div>
            <span class="card-index">02 / TRUST YOUR INSTINCT</span><span class="pick-indicator" data-i18n="picked">你的选择 ↗</span>
            <span class="card-content"><span class="game-meta" id="right-meta">STEAM</span><span class="game-name" id="right-name">下一位挑战者即将登场</span><span class="score-row"><span class="score hidden-score" id="right-score">?</span><span class="score-caption"><span data-i18n="scoreLabel">STEAM 好评率</span><span id="right-score-caption" data-i18n="hiddenHint">猜猜它的好评率</span><span class="review-count" id="right-reviews"></span></span></span></span>
            <span class="card-choice"><span data-i18n="choose">这款好评率更高</span><span aria-hidden="true">↗</span></span>
          </button>
          <div class="card-footnote"><span data-i18n="pickRight">→ 点击封面选择</span><a id="right-source" target="_blank" rel="noopener noreferrer" data-i18n="source" hidden>Steam 评价 ↗</a></div>
        </div>
      </div>
      <div class="feedback" id="feedback-box"><div class="feedback-content"><span class="feedback-icon" id="feedback-icon" aria-hidden="true">↖</span><div><strong id="feedback-title" role="status" aria-live="polite"></strong><p id="feedback-detail"></p></div></div><button class="primary-button" id="next-button" type="button" hidden></button><button class="primary-button" id="retry-button" type="button" data-i18n="retry" hidden>重新加载 ↻</button></div>
    </section>
    <div class="under-game"><span data-i18n="reminder">♡ 五次失误机会 · 看完结果再继续 · 同分也算对</span><div class="under-actions"><button class="text-button" id="refresh-button" type="button" data-i18n="refresh">刷新题库 · 新一局 ↻</button><button class="text-button" id="restart-button" type="button" data-i18n="restart" disabled>重新开始 ↻</button></div></div>
    <footer><div><span class="footer-brand">scoreduel.</span><span data-i18n="footer">为游戏热爱者准备的一场小对决。</span></div><button type="button" class="text-button" id="data-button" data-i18n="dataButton">数据与致谢 ↗</button></footer>
  </main>
  <dialog id="rules-dialog" aria-labelledby="rules-title"><button class="close-button" type="button" data-close aria-label="关闭">×</button><span class="eyebrow" data-i18n="rulesEyebrow">游戏规则</span><h2 id="rules-title" data-i18n="rulesTitle">相信你的游戏直觉。</h2><ol><li data-i18n="rule1"></li><li data-i18n="rule2"></li><li data-i18n="rule3"></li><li data-i18n="rule4"></li></ol><p data-i18n="rule5"></p></dialog>
  <dialog id="data-dialog" aria-labelledby="data-title"><button class="close-button" type="button" data-close aria-label="关闭">×</button><span class="eyebrow" data-i18n="dataEyebrow"></span><h2 id="data-title" data-i18n="dataTitle"></h2><p id="data-description"></p><p data-i18n="dataPolicy"></p><p data-i18n="dataCatalog"></p><p data-i18n="dataCache"></p><p data-i18n="dataCredits"></p><a href="https://store.steampowered.com/" target="_blank" rel="noopener noreferrer" data-i18n="steamLink">访问 Steam ↗</a></dialog>
  <dialog id="over-dialog" class="over-dialog" aria-labelledby="over-title"><span class="eyebrow" data-i18n="endEyebrow"></span><div class="end-symbol" aria-hidden="true">✳</div><h2 id="over-title" data-i18n="endTitle"></h2><p data-i18n="endIntro"></p><div class="final-score" id="final-score">0</div><span class="final-label" data-i18n="questions"></span><p id="final-detail"></p><div class="language-switch end-language" role="group" aria-label="Language"><button type="button" data-language="zh" lang="zh-CN">中文</button><button type="button" data-language="en" lang="en">EN</button></div><button class="primary-button" id="play-again" type="button" data-i18n="playAgain"></button><button class="text-button" id="review-button" type="button" data-i18n="review"></button></dialog>
</body>
</html>
